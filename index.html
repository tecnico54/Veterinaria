<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="shorcut icon" href="IMG/Veterinaria.png">
        <link rel="stylesheet" href="CSS/Veterinaria.css">
        <title>Registro de pacientes</title>
    </head>
    <body>
       <main Veterinaria>
            <h1>Veterinaria</h1>
            <form class="Formulario">
                <input class="Formulario__Entrada" type="text" id="iD" placeholder="Ingresar TI" max="10"><br><br>
                <input class="Formulario__Entrada" type="text" id="nombre" placeholder="Ingresar nombre" max="8"><br><br>
                <input class="Formulario__Entrada" type="text" id="raza" placeholder="Ingresar raza" max="30"><br><br>
                <input class="Formulario__Entrada" type="number" id="edad" placeholder="Ingresar edad" max="2">
            </form>
            <button id="guardar" type="button">Guardar</button>
            <button id="editar" type="button">Edititar</button>
            <button id="eliminarE" type="button">Eliminar</button>
            <button id="eliminarM" type="button">Eliminar pacientes</button>
       </main>
    </body>
</html>
